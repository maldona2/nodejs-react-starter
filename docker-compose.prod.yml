services:
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=/api
    restart: unless-stopped
  backend:
    restart: unless-stopped
    # DATABASE_URL es OBLIGATORIA en prod (sin default inseguro).
    # Seteala en el entorno o en un .env junto al compose, p.ej:
    #   DATABASE_URL=postgres://<user>:<pass>@postgres:5432/<db>
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL must be set (no insecure default)}
  postgres:
    restart: unless-stopped
    # Postgres no se expone al host: el base no define ports y el overlay
    # dev es el único que publica 5433.
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (no insecure default)}
      - POSTGRES_DB=${POSTGRES_DB:-mydb}
